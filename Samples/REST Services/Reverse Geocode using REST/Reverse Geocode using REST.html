<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reverse Geocode with REST - Azure Maps Web SDK Samples</title>

    <meta charset="utf-8" />
	<link rel="shortcut icon" href="/favicon.ico"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="This sample shows how to use the REST API for Azure Maps to reverse geocode a coordinate." />
    <meta name="keywords" content="Microsoft maps, map, gis, API, SDK, REST, search, reverse, geocode, geocoding, address, addresses" />
    <meta name="author" content="Microsoft Azure Maps" /><meta name="version" content="1.0" />
    <meta name="screenshot" content="screenshot.jpg" />

    <!-- Add references to the Azure Maps Map control JavaScript and CSS files. -->
    <link href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" rel="stylesheet" />
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>

    <!-- Add a reference to the Azure Maps REST helper. -->
    <script src="/lib/azure-maps/azure-maps-helper.min.js"></script>

    <script>
        var map, popup;
        var searchId = 0;

        function getMap() {
            //Initialize a map instance.
            map = new atlas.Map('myMap', {
                center: [-122.335, 47.608],
                zoom: 15,
                view: 'Auto',
                language: 'Auto',

                //Add authentication details for connecting to Azure Maps.
                authOptions: {
                    // Use SAS token for authentication 
                    authType: 'sas',
                    getToken: function (resolve, reject, map) {
                        // URL to your authentication service that retrieves a SAS Token
                        var tokenServiceUrl = 'https://samples.azuremaps.com/api/GetAzureMapsSasToken';

                        fetch(tokenServiceUrl).then(r => r.text()).then(token => resolve(token));
                    }

                    //Alternatively, use an Azure Maps key. Get an Azure Maps key at https://azure.com/maps. NOTE: The primary key should be used as the key.
                    //authType: 'subscriptionKey',
                    //subscriptionKey: '[YOUR_AZURE_MAPS_KEY]'
                }
            });

            //Wait until the map resources are ready.
            map.events.add('ready', function () {
                //Update the style of mouse cursor to a crosshair.
                map.getCanvasContainer().style.cursor = 'crosshair';

                //Create a popup but leave it closed so we can update it and display it later.
                popup = new atlas.Popup({
                    position: [0, 0]
                });

                //Add a click event to the map.
                map.events.add('click', mapClicked);
            });
        }

        function mapClicked(e) {
            var requestId = ++searchId;
            //Execute the reverse address search query and open a popup once a response is received.
            var url = 'https://{azMapsDomain}/search/address/reverse/json?api-version=1.0&view=Auto&query=' +
                encodeURIComponent(e.position[1] + ',' + e.position[0]);
            return processRequest(url, { timeout: 3000 }).then(results => {
                if (requestId !== searchId) {
                    return;
                }
                var address = results.addresses.length ? results.addresses[0].address : null;

                var content = '<div style="padding:10px">';

                if (address && address.freeformAddress) {
                    content += address.freeformAddress;
                } else {
                    content += 'No address for that location!';
                }

                content += '</div>';

                //Set the popup options.
                popup.setOptions({
                    position: e.position,
                    content: content
                });

                //Open the popup.
                popup.open(map);
            }).catch(error => {
                if (requestId === searchId) {
                    alert(error.message);
                }
            });
        }
    </script>
</head>
<body onload="getMap()">
    <div id="myMap" style="position:relative;width:100%;min-width:290px;height:600px;"></div>

    <fieldset style="width:calc(100% - 30px);min-width:290px;margin-top:10px;">
        <legend>Reverse Geocode with REST</legend>
        This sample shows how to use the REST API for Azure Maps to reverse geocode a coordinate.
        Click on any location on the map and a coordinate of where you clicked will be used to perform a reverse geocode.
    </fieldset>
</body>
</html>
